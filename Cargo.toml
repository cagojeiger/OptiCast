[workspace]
resolver = "2"
members = [
    "crates/diodecam-core",
    "crates/diodecam-cli",
    "crates/diodecam-vision",
    "crates/diodecam-sim",
    "crates/diodecam-wasm",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
diodecam-core = { path = "crates/diodecam-core" }
diodecam-vision = { path = "crates/diodecam-vision" }
diodecam-sim = { path = "crates/diodecam-sim" }

# raptorq's solver runs expensive self-checks under debug assertions, which
# makes debug tests ~300x slower than release. Build dependencies optimized and
# without debug assertions.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false

# The vision tests push full camera frames (1920×1080) through the simulator and
# the detector; unoptimized they take minutes. Debug assertions stay on.
[profile.dev.package.diodecam-vision]
opt-level = 3

[profile.dev.package.diodecam-sim]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
