# Publishes the phone receiver to GitHub Pages: https://cagojeiger.github.io/diodecam/
# No build tool: web/ is served as it is, next to the wasm built from Rust. Every
# internal URL carries `?v=__V__`, replaced here with the commit, so a browser
# never mixes files from two deploys; the commit also names the offline cache (sw.js).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target wasm32-unknown-unknown -p diodecam-wasm
      - name: Assemble the site
        run: |
          mkdir _site
          cp web/*.html web/*.css web/*.js web/*.webmanifest web/*.png _site/
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/*.html _site/*.css _site/*.js _site/*.webmanifest
          cp target/wasm32-unknown-unknown/release/diodecam_wasm.wasm _site/diodecam.wasm
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
