# Tests on every pull request and push to main. A push to main (or a manual run on main)
# then publishes the phone receiver to GitHub Pages, https://cagojeiger.github.io/diodecam/,
# so a red main never deploys. No build tool: web/ is served as it is, next to the
# wasm the tests ran against. Every internal URL carries `?v=__V__`, replaced with
# the commit, so a browser never mixes files from two deploys; the commit also
# names the offline cache (sw.js).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, in push order, so pushes deploy in the order they were made
# (re-running an old run deploys that old commit again). A new push to a pull request
# cancels its running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - run: cargo test --workspace --release --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The receiver test replays frames from the built sender through the built wasm.
      - run: pnpm wasm
      - run: pnpm test

      - name: Assemble the site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp web/*.html web/*.css web/*.js web/*.webmanifest web/*.png web/diodecam.wasm _site/
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/*.html _site/*.css _site/*.js _site/*.webmanifest
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
