# Tests on every pull request and push to main. A push to main (or a manual run on main)
# then publishes the phone receiver to GitHub Pages, https://cagojeiger.github.io/diodecam/,
# so a red main never deploys. No build tool: web/ is served as it is, next to the
# wasm the tests ran against. Every internal URL carries `?v=__V__`, replaced with
# the commit, so a browser never mixes files from two deploys; the commit also
# names the offline cache (sw.js).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time: a push to main waits for the running deploy, but GitHub keeps
# only the newest waiting run, so a waiting run is cancelled when a newer push arrives and only
# the newest commit deploys (re-running an old run deploys that old commit again). A new push
# to a pull request cancels its running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - run: cargo test --workspace --release --locked
      # The receiver test replays frames from the built sender through the built wasm.
      - run: pnpm wasm
      - run: pnpm test
      # The setup-page picture is generated from the real sender's (deterministic) frames:
      # a status-line change not followed by regenerating it fails here.
      - name: Setup-page terminal picture is current
        run: node tools/terminal-example.ts && git diff --exit-code web/example-terminal.svg

      # Every run assembles the site, so a pull request that breaks it fails before main.
      - name: Assemble the site
        run: |
          mkdir _site
          cp web/*.html web/*.css web/*.js web/*.webmanifest web/*.png web/*.svg web/diodecam.wasm _site/
          # __VERSION__ is the release (Cargo.toml), __V__ the commit (cache name, URL versions).
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$v"
          sed -i "s/__VERSION__/$v/g; s/__V__/${GITHUB_SHA::7}/g" _site/*.html _site/*.css _site/*.js _site/*.webmanifest
          if grep -rlI '__V__\|__VERSION__' _site; then echo 'placeholders left in the files above' >&2; exit 1; fi
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The browser end to end test: real sender, simulated camera, Chrome's fake camera, the
  # receiver page, byte compare (tools/e2e.ts). The only automated cover of web/main.js,
  # worker.js, the IndexedDB resume and the download. It runs after `test` and shows red on
  # a pull request, but `deploy` deliberately does NOT depend on it: it is new and unproven
  # on 2 vCPUs, so a flaky run must not block a deploy. Add it to deploy's `needs` once stable.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tools/e2e.ts builds the sender and the wasm itself and launches the runner's
      # preinstalled Google Chrome (playwright channel 'chrome').
      - run: node tools/e2e.ts
      - name: Resume from IndexedDB after a reload mid-transfer
        run: node tools/e2e.ts --size 600000 --reload-after 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: dist/e2e/
          if-no-files-found: ignore
