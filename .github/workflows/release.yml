# Pushing a tag vX.Y.Z builds the `diodecam` sender for Linux (static musl) and
# macOS and attaches them to a GitHub release once the tagged commit passes the
# tests (cargo test, typecheck, the wasm build and the JS tests, as in ci.yml).
# Asset names carry no version, so .../releases/latest/download/diodecam-<target>.tar.gz
# always works.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Runs beside the builds; the release waits for both.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: cargo test --workspace --release --locked
      # The receiver test replays frames from the built sender through the built wasm.
      - run: pnpm wasm
      - run: pnpm test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p diodecam-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=diodecam-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/diodecam LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: diodecam-${{ matrix.target }}
          path: diodecam-${{ matrix.target }}.tar.gz*

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "DiodeCam $TAG" --generate-notes \
            diodecam-*.tar.gz diodecam-*.tar.gz.sha256
